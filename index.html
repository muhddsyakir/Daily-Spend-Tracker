<!DOCTYPE html>
<html lang="ms">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="icon-192.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belanja Tracker | Multi-Day Realtime</title>
    <style>
        :root {
            --muji-bg: #f7f6f2; 
            --muji-text: #333333;
            --muji-accent: #7f7f7f;
            --muji-red: #bb4444;
            --apple-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--muji-bg);
            color: var(--muji-text);
            font-family: var(--apple-font);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        .app-container {
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        #totalDisplay {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.05em;
        }

        .summary-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            font-size: 0.8rem;
            color: var(--muji-accent);
        }
        .summary-item b { color: var(--muji-text); }

        #whatsappBtn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 30px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.1);
            width: 100%;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            background-color: transparent;
            border: none;
            border-bottom: 1px solid #d1d1d1;
            padding: 15px;
            font-size: 16px; 
            text-align: center;
            outline: none;
        }

        #submitBtn {
            margin-top: 15px;
            background-color: #333;
            color: #fff;
            border: none;
            padding: 20px;
            border-radius: 50px; 
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .history { margin-top: 40px; width: 100%; text-align: left; }
        
        .date-divider {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--muji-accent);
            background: #e9e8e4;
            padding: 5px 15px;
            border-radius: 10px;
            margin: 20px 0 10px 0;
            display: inline-block;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 0.5px solid #e0e0e0;
        }

        .item-info { display: flex; flex-direction: column; }
        .item-label { font-weight: 500; font-size: 0.95rem; }
        .item-time { font-size: 0.7rem; color: var(--muji-accent); }
        .item-amount { font-weight: 600; margin-right: 15px; }

        .delete-btn { color: #ccc; font-size: 1.2rem; cursor: pointer; padding: 5px; }
        .reset-link { margin-top: 50px; font-size: 0.7rem; color: var(--muji-red); opacity: 0.4; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1 style="font-weight:300; font-size:1.1rem; color:var(--muji-accent); margin-bottom:10px;">Rekod Perbelanjaan</h1>
        <div id="totalDisplay">RM 0.00</div>
        
        <div class="summary-box">
            <div class="summary-item">Hari ini: <b id="dailyTotal">RM 0.00</b></div>
            <div class="summary-item">Bulan ini: <b id="monthlyTotal">RM 0.00</b></div>
        </div>
        
        <button id="whatsappBtn" style="display: none;">KONGSI RESIT WHATSAPP</button>
        
        <div class="input-group">
            <input type="text" id="labelInput" placeholder="Jenis bayaran..." autocomplete="off">
            <input type="number" id="amountInput" placeholder="RM 0.00" inputmode="decimal">
            <button id="submitBtn">HANTAR</button>
        </div>

        <div class="history" id="historyLog"></div>

        <div class="reset-link" id="resetBtn">Padam Semua Rekod</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // GANTIKAN DENGAN CONFIG ANDA
        const firebaseConfig = {
  apiKey: "AIzaSyCfbkNGlshgNyQwyKbVpQ3ec1KvKL4x-vY",
  authDomain: "belanjafam-tracker.firebaseapp.com",
  databaseURL: "https://belanjafam-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "belanjafam-tracker",
  storageBucket: "belanjafam-tracker.firebasestorage.app",
  messagingSenderId: "323315241978",
  appId: "1:323315241978:web:f26d76290508b5eff28a43",
  measurementId: "G-G8DXF1DRBV"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, 'belanja');

        const labelInput = document.getElementById('labelInput');
        const amountInput = document.getElementById('amountInput');
        const submitBtn = document.getElementById('submitBtn');
        const whatsappBtn = document.getElementById('whatsappBtn');
        const historyLog = document.getElementById('historyLog');
        const totalDisplay = document.getElementById('totalDisplay');
        const dailyDisplay = document.getElementById('dailyTotal');
        const monthlyDisplay = document.getElementById('monthlyTotal');
        const resetBtn = document.getElementById('resetBtn');

        let currentData = [];

        function triggerHaptic(ms = 10) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        // --- 1. LISTENER REAL-TIME ---
        onSnapshot(query(colRef, orderBy('id', 'desc')), (snapshot) => {
            currentData = [];
            snapshot.docs.forEach(doc => {
                currentData.push({ ...doc.data(), docId: doc.id });
            });
            renderUI(currentData);
        });

        // --- 2. FUNGSI LUKIS UI ---
        function renderUI(data) {
            historyLog.innerHTML = '';
            let totalSemua = 0, totalHariIni = 0, totalBulanIni = 0;
            const skrg = new Date();
            const skrgStr = skrg.toDateString();
            const bulanSkrg = skrg.getMonth();
            const tahunSkrg = skrg.getFullYear();

            whatsappBtn.style.display = (data.length > 0) ? 'block' : 'none';

            let lastDateLabel = "";

            data.forEach(item => {
                const d = new Date(item.id);
                totalSemua += item.amount;
                
                if (d.getFullYear() === tahunSkrg && d.getMonth() === bulanSkrg) {
                    totalBulanIni += item.amount;
                    if (d.toDateString() === skrgStr) totalHariIni += item.amount;
                }

                // Date Divider logic
                const dateLabel = d.toLocaleDateString('ms-MY', { weekday: 'long', day: 'numeric', month: 'short' });
                if (dateLabel !== lastDateLabel) {
                    const divider = document.createElement('div');
                    divider.className = 'date-divider';
                    divider.innerText = d.toDateString() === skrgStr ? "HARI INI" : dateLabel;
                    historyLog.appendChild(divider);
                    lastDateLabel = dateLabel;
                }

                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="item-info">
                        <span class="item-label">${item.label}</span>
                        <span class="item-time">${item.timeOnly}</span>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <span class="item-amount">RM ${item.amount.toFixed(2)}</span>
                        <span class="delete-btn" onclick="padamSatu('${item.docId}')">×</span>
                    </div>
                `;
                historyLog.appendChild(div);
            });

            totalDisplay.innerText = `RM ${totalSemua.toFixed(2)}`;
            dailyDisplay.innerText = `RM ${totalHariIni.toFixed(2)}`;
            monthlyDisplay.innerText = `RM ${totalBulanIni.toFixed(2)}`;
        }

        // --- 3. FUNGSI HANTAR DATA (OPTIMIZED) ---
        async function hantarData() {
            const label = labelInput.value.trim() || "Lain-lain";
            const val = parseFloat(amountInput.value);

            if (!isNaN(val) && val > 0) {
                triggerHaptic(20);
                
                const skrg = new Date();
                const dataBaru = {
                    id: skrg.getTime(),
                    label: label.charAt(0).toUpperCase() + label.slice(1),
                    amount: val,
                    timeOnly: skrg.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })
                };

                // KOSONGKAN INPUT SERTA-MERTA
                labelInput.value = '';
                amountInput.value = '';
                labelInput.focus();

                try {
                    // Hantar ke Firebase di latar belakang
                    await addDoc(colRef, dataBaru);
                } catch (e) {
                    alert("Gagal simpan ke server: " + e.message);
                    // Masukkan balik nilai jika gagal
                    labelInput.value = dataBaru.label;
                    amountInput.value = dataBaru.amount;
                }
            }
        }

        // --- 4. FUNGSI PADAM ---
        window.padamSatu = async function(docId) {
            if(confirm("Padam item ini?")) {
                await deleteDoc(doc(db, 'belanja', docId));
            }
        }

        resetBtn.onclick = async () => {
            if(confirm("Padam semua rekod di server?")) {
                const snapshot = await getDocs(colRef);
                const batch = writeBatch(db);
                snapshot.docs.forEach((doc) => batch.delete(doc.ref));
                await batch.commit();
            }
        };

        // WhatsApp Export
        whatsappBtn.onclick = () => {
            if (currentData.length === 0) return;
            let mesej = "*RINGKASAN BELANJA REALTIME*%0A------------------------------%0A";
            let currentDay = "";
            [...currentData].reverse().forEach(item => {
                const d = new Date(item.id).toLocaleDateString('ms-MY', {day:'numeric', month:'short'});
                if(d !== currentDay) {
                    mesej += `%0A *${d}*%0A`;
                    currentDay = d;
                }
                mesej += `- ${item.label}: RM${item.amount.toFixed(2)}%0A`;
            });
            mesej += `%0A*TOTAL: ${totalDisplay.innerText}*`;
            window.open(`https://wa.me/?text=${mesej}`, '_blank');
        };

        // Events
        submitBtn.onclick = hantarData;
        labelInput.onkeypress = (e) => { if(e.key === 'Enter') amountInput.focus(); };
        amountInput.onkeypress = (e) => { if(e.key === 'Enter') hantarData(); };

        // Register Service Worker (PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("PWA Active"));
        }
    </script>
</body>
</html>
